<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;background:#0c0c14;color:#e8e8e8;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
::-webkit-scrollbar{display:none}
input[type=number]{-moz-appearance:textfield;font-size:16px !important}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.fu{animation:fu .25s ease both}
.fi{animation:fi .2s ease}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px 110px}
.hdr{background:linear-gradient(180deg,#14141f 0%,#0c0c14 100%);padding:16px 20px 14px;padding-top:max(16px,env(safe-area-inset-top));position:sticky;top:0;z-index:50}
.hdr-in{max-width:480px;margin:0 auto}
.btn{border:none;cursor:pointer;font-family:'DM Sans',system-ui;-webkit-appearance:none}
.card{background:rgba(255,255,255,0.04);border-radius:16px;border:1px solid rgba(255,255,255,0.06);padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.inp{width:100%;padding:11px 12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;font-size:16px;font-family:'JetBrains Mono',monospace;color:#fff;outline:none;transition:border-color .15s}
.inp::placeholder{color:#3d3d4d}
.tab-bar{display:flex;gap:4px;margin-bottom:14px;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px}
.tab-btn{flex:1;padding:10px 0;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',system-ui;transition:all .15s;background:transparent;color:#666}
.tab-btn.active{color:#fff}
.yt-btn{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:600;color:#e94560;text-decoration:none;background:rgba(233,69,96,0.1);padding:8px 14px;border-radius:24px}
.rir-badge{display:inline-block;font-size:9px;font-weight:700;background:rgba(30,58,138,.5);color:#9dbdf0;padding:2px 8px;border-radius:6px;vertical-align:middle}
.fail-badge{display:inline-block;font-size:9px;font-weight:700;background:#e94560;color:#fff;padding:2px 8px;border-radius:6px;vertical-align:middle}
.icon-circle{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mono{font-family:'JetBrains Mono',monospace}
.sec-hd{font-size:12px;font-weight:700;margin:16px 0 8px;padding:8px 12px;border-radius:10px;letter-spacing:.5px}
.save-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(12,12,20,0) 0%,#0c0c14 34%);padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));z-index:60}
.save-btn{display:block;max-width:448px;margin:0 auto;width:100%;padding:15px 0;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',system-ui;color:#fff}
.toast{position:fixed;bottom:96px;left:50%;background:#1e3a8a;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:99;animation:tin .25s ease}
.opt-chip{display:inline-block;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',system-ui;transition:all .15s;background:rgba(255,255,255,.06);color:#666;margin-right:6px;margin-bottom:6px}
.opt-chip.on{background:#e76f51;color:#fff}
</style>

    {n:"Pallof Press",s:"3\u00d710/side",r:"60s",nt:"Anti-rotation \u2014 press cable out and hold 2\u20133s",mu:"Core (anti-rotation)",yt:"https://www.youtube.com/watch?v=AH_QZLm_0-s",fl:0}
  ],
  wu: [
    {n:"Incline walk or bike",d:"3 min"},
    {n:"Leg Swings F/B",d:"10 each leg"},
    {n:"Leg Swings L/R",d:"10 each leg"},
    {n:"Glute Bridges",d:"12 reps"},
    {n:"Bodyweight Squats",d:"10 reps"},
    {n:"World\u2019s Greatest Stretch",d:"4 each side"}
  ]
};

var CARDIO_OPTS = [
  {k:"run", label:"Running", total:"50 min", blocks:[
    {t:"0\u201310 min",d:"Brisk walk warmup \u2014 5\u20136 km/h, slight incline"},
    {t:"10\u201335 min",d:"Steady run at conversational pace \u2014 ~8\u20139 km/h"},
    {t:"35\u201345 min",d:"Intervals \u2014 5 rounds: 1 min fast (12 km/h) / 1 min walk"},
    {t:"45\u201350 min",d:"Cooldown walk, then stretches"}
  ]},
  {k:"row", label:"Rowing", total:"50 min", blocks:[
    {t:"0\u20135 min",d:"Easy row, low resistance \u2014 find your rhythm"},
    {t:"5\u201325 min",d:"Steady pace, moderate resistance \u2014 24\u201326 strokes/min"},
    {t:"25\u201340 min",d:"Intervals \u2014 10 rounds: 1 min hard / 30s easy"},
    {t:"40\u201350 min",d:"Steady easy row, then cooldown"}
  ]},
  {k:"bike", label:"Bike", total:"55 min", blocks:[
    {t:"0\u20135 min",d:"Easy spin warmup, light resistance"},
    {t:"5\u201330 min",d:"Steady moderate resistance \u2014 80\u201390 rpm"},
    {t:"30\u201345 min",d:"Hill intervals \u2014 5 rounds: 2 min high resistance / 1 min easy"},
    {t:"45\u201355 min",d:"Easy spin cooldown"}
  ]},
  {k:"ball", label:"Basketball", total:"45 min", blocks:[
    {t:"0\u201310 min",d:"Shooting warmup \u2014 free throws and mid-range"},
    {t:"10\u201335 min",d:"Shooting with movement \u2014 spot shooting, layup lines, or pickup"},
    {t:"35\u201345 min",d:"Sprints \u2014 6\u20138 rounds of suicides or full-court runs"}
  ]}
];

var CORE_CIRCUIT = [
  {n:"Plank Hold",d:"3\u00d745\u201360s, 30s rest"},
  {n:"Dead Bug",d:"3\u00d710/side, 30s rest"},
  {n:"Hanging Knee Raises",d:"3\u00d710\u201312, 45s rest"},
  {n:"Side Plank",d:"2\u00d730s each side"}
];

var CARDIO_WU = [
  {n:"Light bike or walk",d:"5 min"},
  {n:"Glute Bridges",d:"10 reps"},
  {n:"Band Pull-Aparts",d:"15 reps"},
  {n:"Band External Rotations",d:"10 each arm"}
];

var COOLDOWN = [
  {n:"Standing Hamstring Stretch",d:"45s each leg"},
  {n:"Seated Hamstring Stretch",d:"45s each leg"},
  {n:"Hip Flexor Stretch",d:"45s each side"},
  {n:"Figure-4 Glute Stretch",d:"30\u201345s each side"},
  {n:"Child\u2019s Pose",d:"30s"},
  {n:"Calf Stretch",d:"30s each leg"}
];

var WORKOUTS = {upper: UPPER, lower: LOWER};

var st = {view:"home", wid:null, tab:"exercises", cardioOpt:"run", toast:null};
var db = {last:{}, lastDate:{}, cur:{}};
try { var raw = localStorage.getItem(SK); if(raw){ var p = JSON.parse(raw); db.last = p.last||{}; db.lastDate = p.lastDate||{}; db.cur = p.cur||{}; } } catch(e) {}

function save(){ try { localStorage.setItem(SK, JSON.stringify(db)); } catch(e) {} }
function key(wid,ei,si,f){ return wid+"_"+ei+"_"+si+"_"+f; }
function curV(wid,ei,si,f){ return db.cur[key(wid,ei,si,f)] || ""; }
function lastV(wid,ei,si,f){ return db.last[key(wid,ei,si,f)] || ""; }
function nSets(s){ var m = s.match(/(\d+)/); return m ? parseInt(m[1]) : 3; }

function ago(iso){
  if(!iso) return null;
  var d = Math.floor((Date.now() - new Date(iso).getTime())/86400000);
  if(d <= 0) return "today";
  if(d === 1) return "yesterday";
  return d + " days ago";
}

function toast(msg){ st.toast = msg; render(); setTimeout(function(){ st.toast = null; render(); }, 1800); }

function completeSession(wid){
  var w = WORKOUTS[wid], any = false;
  for(var ei=0; ei<w.ex.length; ei++){
    var ns = nSets(w.ex[ei].s);
    for(var si=0; si<ns; si++){
      ["w","r"].forEach(function(f){
        var k = key(wid,ei,si,f), v = db.cur[k];
        if(v){ db.last[k] = v; any = true; }
      });
    }
  }
  if(!any){ toast("Log some sets first"); return; }
  db.lastDate[wid] = new Date().toISOString();
  for(var k2 in db.cur){ if(k2.indexOf(wid+"_") === 0) delete db.cur[k2]; }
  save();
  st.view = "home"; st.wid = null;
  toast("Session saved \u2713");
  window.scrollTo(0,0);
}

function render(){
  var h = "";

  // ---------- HEADER ----------
  h += '<div class="hdr"><div class="hdr-in">';
  if(st.view === "home"){
    h += '<div style="display:flex;justify-content:space-between;align-items:center">';
    h += '<div><h1 style="font-size:19px;font-weight:700;letter-spacing:-.3px;color:#fff">Athletic Strength</h1>';
    h += '<p style="font-size:11px;color:#666;margin-top:2px">Upper / Lower \u00b7 4 lifts + weekend</p></div>';
    h += '<button class="btn" onclick="resetAll()" style="background:rgba(255,255,255,.06);color:#666;padding:8px 14px;border-radius:10px;font-size:11px">Reset</button>';
    h += '</div>';
  } else {
    var title = st.view === "cardio" ? "Weekend Session" : WORKOUTS[st.wid].t;
    var sub = st.view === "cardio" ? "Cardio + Core" : WORKOUTS[st.wid].days;
    h += '<div style="display:flex;align-items:center;gap:12px">';
    h += '<button class="btn" onclick="goHome()" style="background:rgba(255,255,255,.08);color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center">\u2190</button>';
    h += '<div><div style="font-size:11px;color:#666;font-weight:600">'+sub+'</div>';
    h += '<h2 style="font-size:18px;font-weight:700;color:#fff">'+title+'</h2></div></div>';
  }
  h += '</div></div>';

  h += '<div class="wrap">';

  // ---------- HOME ----------
  if(st.view === "home"){
    h += '<div class="fi">';
    h += '<div class="card" style="border:none;display:flex;align-items:center;gap:11px">';
    h += '<span style="font-size:20px">\uD83D\uDEB6</span><div>';
    h += '<div style="font-size:13px;font-weight:600;color:#ccc">10,000\u201312,000 steps daily</div>';
    h += '<div style="font-size:11px;color:#666">2,100\u20132,200 kcal \u00b7 150\u2013160g protein</div></div></div>';

    ["upper","lower"].forEach(function(wid, i){
      var w = WORKOUTS[wid];
      var a = ago(db.lastDate[wid]);
      var inProg = false;
      for(var k in db.cur){ if(k.indexOf(wid+"_") === 0 && db.cur[k]){ inProg = true; break; } }
      h += '<div class="fu" style="animation-delay:'+(i*45)+'ms">';
      h += '<div class="card" style="cursor:pointer;border-color:'+w.c+'33" onclick="openWorkout(\''+wid+'\')">';
      h += '<div style="display:flex;align-items:center;gap:14px">';
      h += '<div class="icon-circle" style="background:'+w.c+'2e">'+w.ic+'</div>';
      h += '<div style="flex:1">';
      h += '<div style="font-size:11px;font-weight:700;color:'+w.c+';text-transform:uppercase;letter-spacing:1.2px">'+w.days+'</div>';
      h += '<div style="font-size:16px;font-weight:600;color:#fff;margin-top:2px">'+w.t+'</div>';
      h += '<div style="font-size:11px;color:#555;margin-top:2px">'+w.ex.length+' exercises'+(a ? ' \u00b7 last done '+a : ' \u00b7 not logged yet')+'</div>';
      if(inProg) h += '<div style="font-size:10px;color:#e76f51;margin-top:3px;font-weight:600">\u25CF In progress</div>';
      h += '</div><div style="color:#333;font-size:22px">\u203A</div>';
      h += '</div></div></div>';
    });

    h += '<div class="fu" style="animation-delay:90ms">';
    h += '<div class="card" style="cursor:pointer;border-color:#e76f5133" onclick="openCardio()">';
    h += '<div style="display:flex;align-items:center;gap:14px">';
    h += '<div class="icon-circle" style="background:#e76f512e">\uD83D\uDD25</div>';
    h += '<div style="flex:1">';
    h += '<div style="font-size:11px;font-weight:700;color:#e76f51;text-transform:uppercase;letter-spacing:1.2px">Weekend</div>';
    h += '<div style="font-size:16px;font-weight:600;color:#fff;margin-top:2px">Cardio + Core</div>';
    h += '<div style="font-size:11px;color:#555;margin-top:2px">4 rotating options \u00b7 45\u201355 min</div>';
    h += '</div><div style="color:#333;font-size:22px">\u203A</div>';
    h += '</div></div></div>';

    h += '<div class="fu" style="animation-delay:135ms">';
    h += '<div class="card" style="background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.04)">';
    h += '<div style="font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Week Structure</div>';
    [["Mon","Upper","#1e3a8a"],["Tue / Wed","Lower","#2d6a4f"],["Thu","Upper","#1e3a8a"],["Fri","Lower","#2d6a4f"],["Weekend","Cardio + Core","#e76f51"]].forEach(function(r,i){
      h += '<div style="display:flex;justify-content:space-between;padding:7px 0;'+(i<4?'border-bottom:1px solid rgba(255,255,255,.04)':'')+'">';
      h += '<span style="font-size:13px;color:#888">'+r[0]+'</span>';
      h += '<span style="font-size:13px;font-weight:600;color:'+r[2]+'">'+r[1]+'</span></div>';
    });
    h += '</div></div>';
    h += '</div>';

  // ---------- WORKOUT ----------
  } else if(st.view === "workout"){
    var w = WORKOUTS[st.wid];
    var a2 = ago(db.lastDate[st.wid]);

    h += '<div class="fi">';
    h += '<div class="tab-bar">';
    [["exercises","Exercises ("+w.ex.length+")"],["warmup","Warm-Up"],["cooldown","Cool-Down"]].forEach(function(t){
      h += '<button class="btn tab-btn '+(st.tab===t[0]?'active':'')+'" style="'+(st.tab===t[0]?'background:'+w.c:'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
    });
    h += '</div>';

    if(st.tab === "exercises"){
      if(a2){
        h += '<div style="background:'+w.c+'18;border:1px solid '+w.c+'33;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#9dbdf0">';
        h += 'Greyed numbers are from your last session ('+a2+'). Beat them where you can.</div>';
      } else {
        h += '<div style="background:rgba(146,64,14,.13);border:1px solid rgba(146,64,14,.3);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#fbbf24">';
        h += 'First session \u2014 pick weights you can control for all reps. These become your reference.</div>';
      }

      w.ex.forEach(function(ex, ei){
        var ns = nSets(ex.s);
        var isMain = ex.r === "90s";
        h += '<div class="fu" style="animation-delay:'+(ei*28)+'ms;margin-bottom:12px">';
        h += '<div style="background:rgba(255,255,255,.04);border-radius:16px;border:'+(isMain?'1px solid '+w.c+'44':'1px solid rgba(255,255,255,.06)')+';overflow:hidden">';
        if(isMain) h += '<div style="height:3px;background:'+w.c+'"></div>';

        h += '<div style="padding:14px 16px">';
        h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">';
        h += '<div style="flex:1"><div style="font-size:15px;font-weight:700;color:#fff">'+ex.n+'</div>';
        h += '<div style="font-size:12px;color:#666;margin-top:3px">'+ex.nt+'</div>';
        h += '<div style="font-size:10px;color:#8b6bb8;margin-top:4px;font-weight:500">'+ex.mu+'</div>';
        h += '<div style="margin-top:7px">'+(ex.fl?'<span class="fail-badge">\uD83D\uDD25 LAST SET \u2192 FAILURE</span>':'<span class="rir-badge">STOP 1\u20132 REPS SHORT</span>')+'</div>';
        h += '</div>';
        h += '<div style="text-align:right;flex-shrink:0">';
        h += '<div class="mono" style="font-size:15px;font-weight:700;color:'+w.c+'">'+ex.s+'</div>';
        h += '<div style="font-size:11px;color:#555">'+ex.r+' rest</div></div>';
        h += '</div>';
        h += '<a href="'+ex.yt+'" target="_blank" rel="noopener" class="yt-btn">\u25B6 Watch Form</a>';
        h += '</div>';

        h += '<div style="padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.04)">';
        h += '<div style="display:grid;grid-template-columns:30px 1fr 1fr;gap:6px 10px;align-items:center">';
        h += '<span style="font-size:10px;font-weight:700;color:#444">SET</span>';
        h += '<span style="font-size:10px;font-weight:700;color:#444">KG</span>';
        h += '<span style="font-size:10px;font-weight:700;color:#444">REPS</span>';
        for(var si=0; si<ns; si++){
          var isLast = (si === ns-1) && ex.fl;
          var bd = isLast ? 'border-color:rgba(233,69,96,.3)' : '';
          var blur = isLast ? 'rgba(233,69,96,.3)' : 'rgba(255,255,255,.08)';
          h += '<span class="mono" style="font-size:13px;font-weight:700;color:'+(isLast?'#e94560':w.c)+'">'+(si+1)+(isLast?'\uD83D\uDD25':'')+'</span>';
          ["w","r"].forEach(function(f){
            var lv = lastV(st.wid,ei,si,f);
            var cv = curV(st.wid,ei,si,f);
            h += '<input type="number" inputmode="'+(f==="w"?"decimal":"numeric")+'" class="inp" style="'+bd+'" placeholder="'+(lv||"\u2014")+'" value="'+cv+'" '+
                 'onchange="setVal(\''+st.wid+'\','+ei+','+si+',\''+f+'\',this.value)" '+
                 'onfocus="this.style.borderColor=\''+w.c+'\'" onblur="this.style.borderColor=\''+blur+'\'"/>';
          });
        }
        h += '</div></div></div></div>';
      });

    } else if(st.tab === "warmup"){
      h += '<div class="fi"><div style="font-size:11px;color:#666;margin-bottom:12px;font-style:italic">~6\u20138 min before you start</div>';
      w.wu.forEach(function(x,i){
        h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;'+(i<w.wu.length-1?'border-bottom:1px solid rgba(255,255,255,.05)':'')+'">';
        h += '<span style="font-size:14px;font-weight:500;color:#ccc">'+x.n+'</span>';
        h += '<span class="mono" style="font-size:13px;font-weight:600;color:'+w.c+'">'+x.d+'</span></div>';
      });
      h += '</div>';

    } else {
      h += '<div class="fi"><div style="font-size:11px;color:#666;margin-bottom:12px;font-style:italic">~6\u20138 min. Extra hamstring focus.</div>';
      COOLDOWN.forEach(function(x,i){
        h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;'+(i<COOLDOWN.length-1?'border-bottom:1px solid rgba(255,255,255,.05)':'')+'">';
        h += '<span style="font-size:14px;font-weight:500;color:#ccc">'+x.n+'</span>';
        h += '<span class="mono" style="font-size:13px;font-weight:600;color:#2d6a4f">'+x.d+'</span></div>';
      });
      h += '</div>';
    }
    h += '</div>';

  // ---------- CARDIO ----------
  } else if(st.view === "cardio"){
    h += '<div class="fi">';
    h += '<div style="font-size:11px;color:#666;margin-bottom:9px">Rotate weekly so it stays fresh</div>';
    h += '<div style="margin-bottom:16px">';
    CARDIO_OPTS.forEach(function(o){
      h += '<button class="btn opt-chip '+(st.cardioOpt===o.k?'on':'')+'" onclick="setCardio(\''+o.k+'\')">'+o.label+'</button>';
    });
    h += '</div>';

    var opt = null;
    CARDIO_OPTS.forEach(function(o){ if(o.k === st.cardioOpt) opt = o; });

    h += '<div class="sec-hd" style="background:rgba(231,111,81,.12);color:#e76f51">WARM-UP \u00b7 5 MIN</div>';
    CARDIO_WU.forEach(function(x,i){
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 4px;'+(i<CARDIO_WU.length-1?'border-bottom:1px solid rgba(255,255,255,.05)':'')+'">';
      h += '<span style="font-size:13px;color:#ccc">'+x.n+'</span>';
      h += '<span class="mono" style="font-size:12px;font-weight:600;color:#e76f51">'+x.d+'</span></div>';
    });

    h += '<div class="sec-hd" style="background:rgba(231,111,81,.12);color:#e76f51">'+opt.label.toUpperCase()+' \u00b7 '+opt.total+'</div>';
    opt.blocks.forEach(function(b,i){
      h += '<div class="fu" style="animation-delay:'+(i*30)+'ms;margin-bottom:8px">';
      h += '<div style="background:rgba(255,255,255,.04);border-radius:14px;border:1px solid rgba(255,255,255,.06);padding:13px 16px">';
      h += '<div class="mono" style="font-size:12px;font-weight:700;color:#e76f51">'+b.t+'</div>';
      h += '<div style="font-size:13px;color:#ccc;margin-top:4px">'+b.d+'</div>';
      h += '</div></div>';
    });

    h += '<div class="sec-hd" style="background:rgba(231,111,81,.12);color:#e76f51">CORE CIRCUIT</div>';
    CORE_CIRCUIT.forEach(function(x,i){
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;'+(i<CORE_CIRCUIT.length-1?'border-bottom:1px solid rgba(255,255,255,.05)':'')+'">';
      h += '<span style="font-size:14px;font-weight:500;color:#ccc">'+x.n+'</span>';
      h += '<span class="mono" style="font-size:12px;font-weight:600;color:#e76f51">'+x.d+'</span></div>';
    });

    h += '<div class="sec-hd" style="background:rgba(45,106,79,.14);color:#4d9e73">COOL-DOWN</div>';
    COOLDOWN.forEach(function(x,i){
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;'+(i<COOLDOWN.length-1?'border-bottom:1px solid rgba(255,255,255,.05)':'')+'">';
      h += '<span style="font-size:14px;font-weight:500;color:#ccc">'+x.n+'</span>';
      h += '<span class="mono" style="font-size:12px;font-weight:600;color:#4d9e73">'+x.d+'</span></div>';
    });
    h += '</div>';
  }

  h += '</div>';

  // ---------- SAVE BAR ----------
  if(st.view === "workout" && st.tab === "exercises"){
    var wc = WORKOUTS[st.wid].c;
    h += '<div class="save-bar"><button class="btn save-btn" style="background:'+wc+'" onclick="completeSession(\''+st.wid+'\')">Complete Session</button></div>';
  }

  if(st.toast) h += '<div class="toast">'+st.toast+'</div>';

  document.getElementById("app").innerHTML = h;
}

window.goHome = function(){ st.view = "home"; st.wid = null; render(); window.scrollTo(0,0); };
window.openWorkout = function(wid){ st.view = "workout"; st.wid = wid; st.tab = "exercises"; render(); window.scrollTo(0,0); };
window.openCardio = function(){ st.view = "cardio"; render(); window.scrollTo(0,0); };
window.setTab = function(t){ st.tab = t; render(); };
window.setCardio = function(k){ st.cardioOpt = k; render(); };
window.setVal = function(wid,ei,si,f,v){ db.cur[key(wid,ei,si,f)] = v; save(); };
window.completeSession = completeSession;
window.resetAll = function(){
  if(confirm("Delete all saved history?")){ db = {last:{}, lastDate:{}, cur:{}}; localStorage.removeItem(SK); render(); }
};

render();
})();
</script>
</body>
</html>
